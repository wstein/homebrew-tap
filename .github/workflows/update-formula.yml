name: update formula

on:
  repository_dispatch:
    types: [new-release]
  workflow_dispatch:
    inputs:
      formula:
        description: Formula name
        required: true
        type: choice
        options: [cx-cli, histlog]
      version:
        description: Upstream version (e.g. 1.2.3)
        required: true

permissions: {}

concurrency:
  group: update-formula-${{ github.event.client_payload.formula || inputs.formula }}
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    env:
      FORMULA: ${{ github.event.client_payload.formula || inputs.formula }}
      VERSION: ${{ github.event.client_payload.version || inputs.version }}
    steps:
      - name: Validate inputs
        run: |
          set -euo pipefail
          case "$FORMULA" in cx-cli|histlog) ;; *) echo "unknown formula" >&2; exit 1 ;; esac
          VERSION="${VERSION#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "invalid version" >&2; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Create GitHub App token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          token: ${{ steps.app.outputs.token }}

      - name: Bump formula
        run: python3 .github/scripts/bump_formula.py "$FORMULA" "$VERSION"

      - name: Open pull request with auto-merge
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- "Formula/$FORMULA.rb"; then
            echo "Formula already at $VERSION."
            exit 0
          fi
          branch="bump/$FORMULA-$VERSION"
          git config user.name "wstein-tap-bot[bot]"
          git config user.email "wstein-tap-bot[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "chore($FORMULA): update to v$VERSION"
          git push --force-with-lease origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "chore($FORMULA): update to v$VERSION" \
            --body "Automated bump to upstream v$VERSION. Merges automatically once test-bot passes."
          gh pr merge "$branch" --auto --rebase
